<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Telegram Mini App — Emulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 500px;
            height: calc(100vh - 80px);
            max-height: 720px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <iframe id="miniAppFrame"></iframe>
</div>

<script>
    // === НАСТРОЙКИ ПОЛЬЗОВАТЕЛЯ ===
    const USER = {
        id: 123456789,               // замени на нужный ID
        first_name: "Иван",
        last_name: "",
        username: "ivan_dev",
        language_code: "ru",
        is_premium: true,
    };

    const AUTH_DATE = Math.floor(Date.now() / 1000);
    const QUERY_ID = "AAFAAAABAAAA"; // фейковый query_id

    // === ДАННЫЕ TELEGRAM WEBAPP ===
    const webAppMock = {
        initData: "", // не используется напрямую в dev
        initDataUnsafe: {
            user: USER,
            auth_date: AUTH_DATE,
            query_id: QUERY_ID,
        },
        colorScheme: "light",
        themeParams: {
            bg_color: "#ffffff",
            text_color: "#000000",
            hint_color: "#999999",
            link_color: "#2481cc",
            button_color: "#2481cc",
            button_text_color: "#ffffff",
        },
        version: "7.2",
        platform: "tdesktop",

        // Методы
        ready: () => console.log("✅ Telegram.WebApp.ready() called"),
        expand: () => console.log("↗️ Telegram.WebApp.expand() called"),
        close: () => window.close(),
        sendData: (data) => console.log("📤 WebApp.sendData:", data),

        // BackButton (для совместимости)
        BackButton: {
            show: () => console.log("⬅️ BackButton.show()"),
            hide: () => console.log("⏹️ BackButton.hide()"),
            onClick: (callback) => {
                console.log("🔁 BackButton click handler set");
                // Для ручного теста: window.simulateBack();
                window.simulateBack = callback;
            }
        },

        // События
        onEvent: (event, callback) => {
            console.log("📡 WebApp.onEvent:", event);
        }
    };

    // === ЗАГРУЗКА ТВОЕГО MINI APP ===
    const APP_URL = "http://localhost:3000"; // ← поменяй, если у тебя другой порт или маршрут

    const frame = document.getElementById("miniAppFrame");
    frame.src = APP_URL;

    frame.onload = () => {
        try {
            // Инжектим Telegram.WebApp в iframe
            frame.contentWindow.Telegram = { WebApp: webAppMock };
            console.log("✅ Telegram.WebApp успешно внедрён в iframe");
        } catch (e) {
            console.error("❌ Не удалось внедрить Telegram.WebApp (возможно, CORS). Убедись, что APP_URL — localhost.");
        }
    };
</script>
</body>
</html>
